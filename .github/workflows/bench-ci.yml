name: bench-ci

on:
  pull_request:
  push:
    branches: [main, 'bench/**']

permissions:
  contents: read

jobs:
  bench-suite:
    name: bench-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
